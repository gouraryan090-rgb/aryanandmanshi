<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Memory ❤️ | Couple Diary</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../diary.css">
</head>

<body>

    <a href="#" id="logoutBtn" class="logout-btn">🚪 Logout</a>

    <div class="background"></div>
    <div class="hearts"></div>

    <div class="diary-container">

        <div class="back-home">
            <a href="diary.html" class="back-btn">⬅ Back to Diary List</a>
        </div>

        <header class="diary-header">
            <div class="diary-icon">✍️</div>
            <h1 id="editorPageTitle">Memory for Date</h1>
            <p>Express your love, thoughts, photos & voice notes ❤️</p>
        </header>

        <div class="diary-card editor-card">
            
            <div class="editor-top-bar">
                <div class="author-select">
                    <span>✍️ Written By:</span>
                    <select id="diaryAuthor">
                        <option value="Aryan">🗿 Aryan</option>
                        <option value="Manshii">💗 Manshii</option>
                    </select>
                </div>
                <div id="selectedDateBadge" class="selected-date-badge">📅 Date: Loading...</div>
            </div>

            <div class="editor-toolbar">
                <button type="button" class="tool-btn" onclick="formatDoc('bold')" title="Bold"><b>B</b></button>
                <button type="button" class="tool-btn" onclick="formatDoc('italic')" title="Italic"><i>I</i></button>
                <button type="button" class="tool-btn" onclick="formatDoc('underline')" title="Underline"><u>U</u></button>
                <button type="button" class="tool-btn" onclick="formatDoc('strikeThrough')" title="Strikethrough"><s>S</s></button>
            </div>
                <span class="tool-divider"></span>

                <div class="color-picker-wrapper" title="Text Color">
                    <span class="color-label">🎨 Color:</span>
                    <input type="color" id="textColorPicker" value="#ff4d94" onchange="formatDoc('foreColor', this.value)">
                </div>

                <div class="color-picker-wrapper" title="Highlight Color">
                    <span class="color-label">✨ Highlight:</span>
                    <input type="color" id="bgColorPicker" value="#6d5dfc" onchange="formatDoc('hiliteColor', this.value)">
                </div>

                <span class="tool-divider"></span>

                <button type="button" class="tool-btn" onclick="formatDoc('justifyLeft')" title="Align Left">⬅️</button>
                <button type="button" class="tool-btn" onclick="formatDoc('justifyCenter')" title="Align Center">↔️</button>
                <button type="button" class="tool-btn" onclick="formatDoc('justifyRight')" title="Align Right">➡️</button>
                <button type="button" class="tool-btn" onclick="formatDoc('insertUnorderedList')" title="Bullet List">• List</button>
                <button type="button" class="tool-btn" onclick="formatDoc('removeFormat')" title="Clear Formatting">🧹 Clear</button>
            </div>

            <input type="text" id="diaryTitle" class="editor-title-input" placeholder="Title for this day (e.g., Long Drive & Coffee ☕)" required>

            <div id="diaryEditor" class="rich-editor" contenteditable="true" placeholder="Type your romantic thoughts, secret memories, or late-night talks here..."></div>

            <!-- Media Attachments Section -->
            <div class="media-attachments-section">
                <h3>📎 Memory Attachments</h3>
                
                <div class="attachments-grid">
                    <!-- Photo Attachment -->
                    <div class="attachment-box">
                        <label for="diaryPhotoInput">📸 Add Photo Memory:</label>
                        <input type="file" id="diaryPhotoInput" accept="image/*" onchange="previewDiaryPhoto(event)">
                        <div id="photoPreviewContainer" class="preview-container" style="display:none;">
                            <img id="diaryPhotoPreview" src="" alt="Photo Memory">
                            <button type="button" onclick="removeDiaryPhoto()" class="remove-media-btn">❌ Remove Photo</button>
                        </div>
                    </div>

                    <!-- Voice Note / Audio Attachment (Live Record + File Upload) -->
                    <div class="attachment-box">
                        <label>🎙️ Add Voice Note / Audio:</label>
                        
                        <!-- Option 1: Live Voice Recorder -->
                        <div class="audio-recording-controls">
                            <button type="button" id="startRecBtn" class="rec-btn" onclick="startRecording()">🎙️ Start Record</button>
                            <button type="button" id="stopRecBtn" class="stop-btn" onclick="stopRecording()" style="display:none;">⏹️ Stop Record</button>
                        </div>
                        <span id="recordingStatus" class="recording-status" style="display:none;">🔴 Recording Voice...</span>

                        <div style="text-align: center; color: #a1a1aa; font-size: 0.8rem; margin: 6px 0;">-- OR --</div>

                        <!-- Option 2: Upload File -->
                        <input type="file" id="diaryAudioInput" accept="audio/*" onchange="previewDiaryAudio(event)">

                        <!-- Preview Player -->
                        <div id="audioPreviewContainer" class="preview-container" style="display:none;">
                            <audio id="diaryAudioPreview" controls style="width: 100%;"></audio>
                            <button type="button" onclick="removeDiaryAudio()" class="remove-media-btn">❌ Remove Audio</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="editor-footer">
                <button id="saveDiaryBtn" class="save-diary-btn" onclick="saveDiaryEntry()">
                    💾 Save Memory & Return ❤️
                </button>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../auth.js"></script>
    <script src="../diary-editor.js"></script>

</body>

</html>
