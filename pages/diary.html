<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Couple Diary ❤️ | Our Little World</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../diary.css">
</head>

<body>

    <a href="#" id="logoutBtn" class="logout-btn">🚪 Logout</a>

    <div class="background"></div>
    <div class="hearts"></div>

    <div class="diary-container">

        <div class="back-home">
            <a href="../dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
        </div>

        <header class="diary-header">
            <div class="diary-icon">📖</div>
            <h1>Our Couple Diary</h1>
            <p>Pick a date to write or revisit our magical moments forever ❤️</p>
        </header>

        <!-- Date Selection Card -->
        <div class="diary-card date-selector-card">
            <h2>📅 Select Memory Date</h2>
            <div class="date-input-group">
                <input type="date" id="diaryDate" class="diary-date-picker">
                <button type="button" class="open-editor-btn" onclick="goToEditor()">
                    ✍️ Open Diary Page
                </button>
            </div>
        </div>

        <!-- Saved Entries List -->
        <div class="diary-card entries-list-card">
            <h2>✨ Saved Memories</h2>
            <div id="memoriesGrid" class="memories-grid">
                <div class="loading-text">🔄 Loading memories...</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../auth.js"></script>
    <script src="../diary-list.js"></script>

</body>

</html>
