<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Our Gallery ❤️</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="gallery.css">
</head>

<body>

    <div class="gallery-page">

        <div class="gallery-header reveal">
            <h1>📸 Our Gallery ❤️</h1>
            <p>
                Every picture has a story,
                every video has a memory,
                and every memory has you. ❤️
            </p>
        </div>

        <div class="gallery-counter">
            <div class="counter-card">
                <h2 id="photoCount">0</h2>
                <span>Photos 📸</span>
            </div>

            <div class="counter-card">
                <h2 id="videoCount">0</h2>
                <span>Videos 🎥</span>
            </div>

            <div class="counter-card">
                <h2>∞</h2>
                <span>Memories ❤️</span>
            </div>
        </div>

        <h2 class="section-title">📷 Photos</h2>
        <div id="photoGallery" class="gallery-grid"></div>

        <h2 class="section-title">🎥 Videos</h2>
        <div id="videoGallery" class="gallery-grid"></div>

        <div id="lightbox" class="lightbox">
            <span id="closeBtn">&times;</span>
            <span id="prevBtn">&#10094;</span>
            <span id="nextBtn">&#10095;</span>

            <img id="lightboxImg" alt="Gallery image">
            <video id="lightboxVideo" controls playsinline webkit-playsinline preload="auto"></video>
        </div>

        <div class="back-home">
            <a href="../dashboard.html" class="back-btn">
                ⬅ Back Home
            </a>
        </div>

    </div>

    <script src="../auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../supabase.js"></script>
    <script src="../gallery.js"></script>

</body>

</html>
