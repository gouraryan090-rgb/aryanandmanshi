<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Gift ❤️</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../gift.css">

</head>

<body>
    <a href="#" id="logoutBtn" class="logout-btn">
    🚪 Logout
</a>

<div class="background"></div>

<div class="hearts"></div>

<section class="about-page gift-page">

    <!-- Header -->

    <div class="profile-card">

        <div class="gift-header">

            <div id="giftUserEmoji" style="font-size:80px;">🎁</div>

            <h1 id="giftTitle">

                Daily Gift

            </h1>

            <p class="tagline">

                Open your daily surprise made with love. ❤️

            </p>

        </div>

    </div>



    <!-- Gift Box -->

    <div class="gift-container">

        <div id="giftBox" class="gift-box">

            🎁

        </div>

        <h2 id="giftStatus">

            Gift Available

        </h2>

        <p>

            Tap the gift box to reveal today's surprise ❤️

        </p>

    </div>



    <!-- Reward Card -->

    <div id="rewardCard" class="reward-card">

        <div id="rewardEmoji" class="reward-emoji">

            ❤️

        </div>

        <h2 id="rewardTitle">

            Reward

        </h2>

        <p id="rewardDescription">

            Description

        </p>

        <div class="reward-note">

            📸 Take a screenshot and send it to your partner ❤️

        </div>

        <button id="acceptBtn">

            Accept ❤️

        </button>

    </div>



    <!-- Cooldown -->

    <div class="cooldown-card">

        <h3>

            Next Gift

        </h3>

        <p id="cooldown">

            Ready ❤️

        </p>

    </div>



    <!-- Last Gift -->

    <div class="last-gift-card">

        <h3>

            Last Gift

        </h3>

        <div id="lastGift">

            No gift claimed yet.

        </div>

    </div>



    <!-- Back -->

    <a id="backBtn" href="aryan.html" class="back-btn">


        ⬅ Back

    </a>

        

</section>

<script src="../auth.js"></script>
<script src="../script.js"></script>
<script src="../gift.js"></script>

</body>

</html>
