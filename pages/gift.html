<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Today's Surprise ❤️</title>

    <link rel="stylesheet" href="../gift.css">

</head>

<body>

    <!-- Background -->

    <div class="bg-blur"></div>

    <!-- Main -->

    <div class="gift-container">

        <h1 id="giftTitle">
            🎁 Today's Surprise
        </h1>

        <p class="subtitle">
            One surprise every 36 hours ❤️
        </p>


        <!-- Countdown -->

        <div class="countdown-card">

            <span class="count-title">
                Next Gift
            </span>

            <div id="countdown">

                Ready ❤️

            </div>

        </div>



        <!-- Gift Box -->

        <div id="giftBox">

            <div class="lid"></div>

            <div class="box"></div>

            <div class="ribbon-v"></div>

            <div class="ribbon-h"></div>

        </div>


        <button id="openGift">

            Open Gift ❤️

        </button>



        <!-- Reward Popup -->

        <div id="rewardPopup">

            <span id="rarity">

                🟢 Common

            </span>

            <h2 id="rewardTitle">

                Luvv Uhh x8 ❤️

            </h2>

            <p id="rewardDescription">

                Say "Luvv Uhh" 8 times.

            </p>

            <div class="divider"></div>

            <div class="screenshot-box">

                📸<br>

                Take a screenshot of this<br>

                and send it to your partner ❤️

            </div>

            <button id="acceptGift">

                Accept ❤️

            </button>

        </div>



        <!-- Last Gift -->

        <div id="lastGiftCard">

            <h3>

                ❤️ Previous Surprise

            </h3>

            <p id="lastGift">

                No gift opened yet.

            </p>

        </div>



        <!-- Back -->

        <a href="../index.html"

            class="backBtn">

            ← Dashboard

        </a>

    </div>



    <script src="../gift.js"></script>

</body>

</html>
