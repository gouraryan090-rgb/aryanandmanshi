<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Media Manager</title>

    <link rel="stylesheet" href="../style.css">

    <link rel="stylesheet" href="../admin.css">

</head>


<body>

    <div class="admin-page">

        <div class="admin-header">

            <div class="admin-header-icon">
                📤
            </div>

            <h1>
                Media Manager
            </h1>

            <p>
                Upload and manage website photos and videos
            </p>

        </div>


        <div class="admin-section">

            <div class="admin-section-header">

                <h2>
                    Upload Media
                </h2>

                <p>
                    Add photos or videos to the website gallery.
                </p>

            </div>


            <div class="media-upload-box">

                <div class="media-upload-icon">
                    ☁️
                </div>

                <h3>
                    Select Photo or Video
                </h3>

                <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none;">

                <label for="mediaFileInput" class="media-select-btn">
                    📁 Choose File
                </label>

            </div>


            <div id="selectedMedia" class="selected-media-box" style="display:none;">

                <div id="mediaPreview" class="media-preview-container"></div>

                <div class="media-details">

                    <span id="mediaFileName" class="media-filename"></span>

                    <span id="mediaFileSize" class="media-filesize"></span>

                </div>

                <button type="button" id="uploadMediaBtn" class="admin-btn" disabled>
                    📤 Start Upload
                </button>

                <div id="uploadProgressContainer" class="upload-progress-container" style="display:none;">

                    <div class="progress-track">

                        <div id="uploadProgressBar" class="progress-bar"></div>

                    </div>

                    <span id="uploadProgressText">
                        Uploading...
                    </span>

                </div>


                <div id="uploadStatus" class="upload-status"></div>

            </div>

        </div>


        <div class="admin-section" style="margin-top: 30px;">

            <div class="admin-section-header">

                <h2>
                    Uploaded Gallery
                </h2>

                <p>
                    Manage and delete existing photos or videos.
                </p>

            </div>

            <div id="mediaLibrary" class="media-library-grid">
                <div class="media-library-loading">
                    🔄 Loading media items...
                </div>
            </div>

        </div>


        <div class="admin-back">

            <a href="admin.html" class="back-btn">
                ← Back to Admin Panel
            </a>

        </div>

    </div>


    <script src="../auth.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../supabase.js"></script>

    <script src="../admin.js"></script>

    <script src="../media-manager.js"></script>


</body>

</html>
